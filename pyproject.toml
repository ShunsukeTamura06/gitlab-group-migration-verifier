[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-group-migrator"
version = "0.1.0"
description = "GitLabグループのExport/Import移行検証ツール"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "GitLab Migration Verification Team"}]
dependencies = []

[project.scripts]
gitlab-migrator = "gitlab_migrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
