name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify production CLI
        run: |
          gitlab-migrator --help > cli-help.txt
          ! grep -Eq 'bootstrap-|smoke-group' cli-help.txt

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          forbidden = {
              "gitlab_migrator/auth.py",
              "gitlab_migrator/bootstrap.py",
          }
          found = sorted(forbidden & names)
          if found:
              raise SystemExit(f"検証専用Moduleがwheelへ混入しています: {found}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gitlab-group-migrator-distributions
          path: dist/*
