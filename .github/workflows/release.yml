name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
          python windows/package_windows_bundle.py --wheel dist/*.whl --output-dir dist
          cd dist
          sha256sum *.whl *.tar.gz *.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Test installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          gitlab-migrator --help > cli-help.txt
          ! grep -Eq 'bootstrap-|smoke-group' cli-help.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
